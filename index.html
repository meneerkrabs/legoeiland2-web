<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>LEGO Eiland 2 is verhuisd / has moved</title>
<meta name="robots" content="noindex">
<script>
  // keep the rest of the path, the query (?debug=1, ...) and the hash
  var rest = location.pathname.replace(/^\/legoeiland2-web\/?/, '');
  location.replace('https://meneerkrabs.github.io/legoisland2-web/' + rest + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://meneerkrabs.github.io/legoisland2-web/">
<link rel="canonical" href="https://meneerkrabs.github.io/legoisland2-web/">
</head>
<body>
<p>LEGO Eiland 2 in de browser is verhuisd naar <a href="https://meneerkrabs.github.io/legoisland2-web/">meneerkrabs.github.io/legoisland2-web</a>.</p>
<p>LEGO Island 2 in the browser has moved to <a href="https://meneerkrabs.github.io/legoisland2-web/">meneerkrabs.github.io/legoisland2-web</a>.</p>
</body>
</html>
